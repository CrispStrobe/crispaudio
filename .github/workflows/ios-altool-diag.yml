# Fast diagnostic (no build) for the altool auth failure — prints the runner's
# altool flags, the installed key state, and secret lengths. Delete once fixed.
name: iOS altool diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - name: Install key + diagnose
        env:
          P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "keyid_len=${#ASC_KEY_ID} issuer_len=${#ASC_ISSUER_ID} appid_len=${#ASC_APP_ID}"
          echo "p8 bytes: $(wc -c < "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8")"
          echo "p8 header: [$(head -c 27 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8")]"
          ls -la "$HOME/.appstoreconnect/private_keys/"
          echo "--- altool version ---"; xcrun altool --version 2>&1 | head -2 || true
          echo "--- altool api flags ---"; xcrun altool --help 2>&1 | grep -iE "api.?key|api.?issuer|apple-id|--type" || true
