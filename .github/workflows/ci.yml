name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-cli:
    name: Media CLI integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './media -> target'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --manifest-path media/Cargo.toml --features native-engine --locked
      - run: cargo build --release --manifest-path media/Cargo.toml
      - run: python3 scripts/test-media-cli.py media/target/release/crispaudio
      - run: python3 scripts/test-video-edit.py media/target/release/crispaudio
      - run: python3 scripts/test-workspace.py media/target/release/crispaudio
  frontend:
    name: Frontend lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: python3 tests/release/test_macos_signing.py
      - run: python3 tests/release/test_altool_result.py
      - run: python3 tests/release/test_native_runtime.py
      - run: python3 tests/release/test_native_command_dsp.py
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm test
      - run: npx vite build

  rust-check:
    name: Rust check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: macos-14
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            patchelf

      - name: Mac signature regression checks
        if: runner.os == 'macOS'
        run: python3 tests/release/test_macos_signing_actual.py

      - name: Native helper cache regression tests
        run: cargo test --manifest-path scripts/native-helper-build/Cargo.toml --target-dir src-tauri/target --locked

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Native input queues and Apple cue worker
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          xcrun clang -std=c11 -Wall -Werror -fsyntax-only ../scripts/fixtures/native-input-abi.c
          cargo test --manifest-path ../media/Cargo.toml --target-dir target --features native-engine --locked --lib native_input
