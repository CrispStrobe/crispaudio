name: Mobile Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init || true

      - name: Patch Xcode project for unsigned build
        run: |
          # Write an xcconfig that disables all signing
          cat > src-tauri/gen/apple/unsigned.xcconfig <<'XCFG'
          CODE_SIGN_IDENTITY = -
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          DEVELOPMENT_TEAM =
          XCFG
          # Inject xcconfig into the generated project
          PROJ="src-tauri/gen/apple/crispaudio.xcodeproj/project.pbxproj"
          if [ -f "$PROJ" ]; then
            sed -i '' 's/DEVELOPMENT_TEAM = "[^"]*"/DEVELOPMENT_TEAM = ""/g' "$PROJ"
          fi

      - name: Build iOS (unsigned)
        env:
          # Tauri requires a non-empty team ID; use a placeholder for unsigned builds
          APPLE_DEVELOPMENT_TEAM: UNSIGNED
          TAURI_APPLE_DEVELOPMENT_TEAM: UNSIGNED
        run: |
          npx tauri ios build \
            -- \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            || echo "::warning::iOS build failed — see logs for details"

      - name: Package .app for sideloading
        if: always()
        run: |
          # Search multiple possible output locations
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p artifacts
            cd "$(dirname "$APP_PATH")"
            tar czf "$GITHUB_WORKSPACE/artifacts/CrispAudio-ios-arm64.app.tar.gz" "$(basename "$APP_PATH")"
            echo "Packaged: $APP_PATH"
          else
            echo "::warning::No .app bundle found"
          fi

      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crispaudio-ios
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - run: npm ci

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Build Android APK (unsigned)
        run: |
          npx tauri android build --apk \
            || echo "::warning::Android build failed — may need additional setup"

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crispaudio-android
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 14
