name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_target: aarch64-apple-darwin
            tauri_args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ''
          - platform: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: '--bundles deb,appimage'

    runs-on: ${{ matrix.platform }}

    env:
      NO_STRIP: 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust_target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'CrispAudio v__VERSION__'
          releaseBody: 'See the [changelog](https://github.com/CrispStrobe/crispaudio/commits/main) for details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

  # macOS Intel — optional, non-blocking (macos-13 is chronically queue-starved)
  release-intel:
    name: Build (macos-13, optional)
    permissions:
      contents: write
    runs-on: macos-13
    continue-on-error: true

    env:
      NO_STRIP: 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: x86_64-apple-darwin

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'CrispAudio v__VERSION__'
          releaseBody: 'See the [changelog](https://github.com/CrispStrobe/crispaudio/commits/main) for details.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-apple-darwin

  publish:
    name: Publish release
    needs: [release]
    # Does NOT need release-intel — Intel is best-effort
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Publishing release for tag: $TAG"
          # Wait a moment for all assets to settle
          sleep 10
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            || echo "::warning::Could not auto-publish — release may need manual publish"
