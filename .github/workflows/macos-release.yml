name: macOS App Store Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'mac-v*'

env:
  TEAM_ID: N9XSJ4M3GT
  BUNDLE_ID: com.crispstrobe.crispaudio

jobs:
  release-macos-appstore:
    name: macOS App Store (.pkg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: mac-appstore
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install npm deps
        run: npm ci
      - name: Setup keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KP="throwaway"
          security create-keychain -p "$KP" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$MAC_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          echo "KC=$KC" >> "$GITHUB_ENV"
      - name: Install provisioning profile
        env:
          MAC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$MAC_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/cs.provisionprofile"
          echo "PROFILE=$RUNNER_TEMP/cs.provisionprofile" >> "$GITHUB_ENV"
      - name: Build cloud-only .app
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles app
          APP=$(find src-tauri/target -path "*aarch64-apple-darwin/release/bundle/macos/*.app" -type d 2>/dev/null | head -1 || true)
          [ -n "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Sign and package .pkg
        run: |
          set -euo pipefail
          APP_CERT="Apple Distribution: Christian Ströbele (N9XSJ4M3GT)"
          INST_CERT="3rd Party Mac Developer Installer: Christian Ströbele (N9XSJ4M3GT)"
          
          cp "$PROFILE" "$APP/Contents/embedded.provisionprofile"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP/Contents/Info.plist"
          
          while IFS= read -r -d '' f; do
            codesign --force --timestamp --options runtime --keychain "$KC" --sign "$APP_CERT" "$f"
          done < <(find "$APP/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null)
          find "$APP/Contents" -type d -name "*.framework" -print0 2>/dev/null | while IFS= read -r -d '' fw; do
            codesign --force --timestamp --options runtime --keychain "$KC" --sign "$APP_CERT" "$fw"
          done
          
          codesign --force --timestamp --options runtime \
            --entitlements src-tauri/entitlements.plist \
            --keychain "$KC" --sign "$APP_CERT" "$APP"
            
          VERSION=$(node -p "require('./package.json').version")
          productbuild --component "$APP" /Applications --sign "$INST_CERT" "CrispAudio_${VERSION}.pkg"
          echo "PKG=CrispAudio_${VERSION}.pkg" >> "$GITHUB_ENV"
          echo "SV=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" >> "$GITHUB_ENV"
          echo "BV=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Contents/Info.plist")" >> "$GITHUB_ENV"
      - name: Validate and Upload
        env:
          ASC_APP_ID: 6791876962
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-package "$PKG" --type macos \
            --apple-id "$ASC_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BV" --bundle-short-version-string "$SV" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tail -25
