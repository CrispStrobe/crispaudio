name: macOS App Store Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign a package without uploading to Apple'
        type: boolean
        default: true
  push:
    tags:
      - 'mac-v*'

env:
  TEAM_ID: N9XSJ4M3GT
  BUNDLE_ID: com.crispstrobe.crispaudio
  # The xcode-27 image starts steps without a UTF-8 locale, so codesign decodes
  # the identity name "...Ströbele..." as MacRoman ("Str√∂bele") and reports
  # "no identity found". Force UTF-8 for every step.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  release-macos-appstore:
    name: macOS App Store (.pkg)
    # ITMS-90725: from April 2027 App Store Connect only accepts builds made
    # with the 27 SDKs (Xcode 27). The standard macOS images only ship
    # Xcode 26.x, so the store build runs on GitHub's xcode-27 image (arm64)
    # and fails before signing if the SDK is older.
    runs-on: xcode-27
    # A signing step that waits on a hidden keychain prompt otherwise hangs
    # until the 6-hour default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 27 and require the macOS 27 SDK
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "macosx SDK: $SDK"
          if [ "${SDK%%.*}" -lt 27 ]; then
            echo "::error::macOS SDK $SDK < 27 (ITMS-90725)"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: mac-appstore
      - name: Reset restored native helper cache
        if: runner.os == 'macOS'
        run: python3 scripts/reset-ci-native-helper-cache.py

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install npm deps
        run: npm ci
      - name: Setup keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Name the real file: create-keychain writes build.keychain-db, and on
          # the xcode-27 image `codesign --keychain .../build.keychain` no longer
          # resolves to it ("no identity found").
          KC="$RUNNER_TEMP/build.keychain-db"
          # Empty password: on the xcode-27 image unlock-keychain rejects the
          # password the keychain was just created with (runner-images#14837).
          # The keychain lives in RUNNER_TEMP on a single-use VM.
          KP=""
          security create-keychain -p "$KP" "$KC"
          # New keychains auto-lock after 300 s; the .app build takes longer,
          # and codesign then blocks on an invisible unlock prompt.
          security set-keychain-settings "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$MAC_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          echo "KC=$KC" >> "$GITHUB_ENV"
      - name: Install provisioning profile
        env:
          MAC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$MAC_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/cs.provisionprofile"
          echo "PROFILE=$RUNNER_TEMP/cs.provisionprofile" >> "$GITHUB_ENV"
      - name: Check provisioning profile before building
        run: |
          python3 scripts/release/check-macos-profile.py "$PROFILE" \
            --team "$TEAM_ID" --bundle "$BUNDLE_ID" \
            --identity "Apple Distribution: Christian Ströbele ($TEAM_ID)" \
            --entitlements-template src-tauri/entitlements.plist \
            --entitlements-output "$RUNNER_TEMP/store-entitlements.plist"
      - name: Restore CrispASR build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/crispaudio-crispasr
          key: crispasr-${{ hashFiles('scripts/crispasr-revision.txt', 'scripts/build-crispasr.sh') }}-arm64
      - name: Build bundled CrispASR library
        run: JOBS=3 bash scripts/build-crispasr.sh
      - name: Build .app
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles app --config src-tauri/generated/crispasr/tauri.conf.json
          APP=$(find src-tauri/target -path "*aarch64-apple-darwin/release/bundle/macos/*.app" -type d 2>/dev/null | head -1 || true)
          [ -n "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
      # An Apple Distribution-signed app cannot run outside the store, so launch
      # an ad-hoc signed copy with the same sandbox entitlements and helpers.
      # This catches launch crashes, missing bundled libraries and sandbox
      # denials at startup before anything is signed for Apple.
      - name: Launch smoke test (sandboxed ad-hoc copy)
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/smoke/$(basename "$APP")"
          rm -rf "$RUNNER_TEMP/smoke"; mkdir -p "$RUNNER_TEMP/smoke"; ditto "$APP" "$S"
          find "$S/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -exec codesign --force --sign - {} \;
          for helper in crispaudio-apple-media crispaudio-vst3-host; do
            codesign --force --sign - --entitlements src-tauri/helper-entitlements.plist "$S/Contents/MacOS/$helper"
          done
          codesign --force --sign - --entitlements src-tauri/entitlements.plist "$S"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$S/Contents/Info.plist")
          touch "$RUNNER_TEMP/smoke-start"
          open -n -g "$S"
          sleep 20
          mkdir -p "$RUNNER_TEMP/smoke-diagnostics"
          find "$HOME/Library/Logs/DiagnosticReports" -newer "$RUNNER_TEMP/smoke-start" -iname "*${EXE}*" \
            -exec cp {} "$RUNNER_TEMP/smoke-diagnostics/" \; 2>/dev/null || true
          ALIVE=$(pgrep -f "$S/Contents/MacOS/$EXE" || true)
          [ -n "$ALIVE" ] && kill $ALIVE || true
          if ls "$RUNNER_TEMP"/smoke-diagnostics/* >/dev/null 2>&1; then
            grep -h -m3 -E '"exception"|termination|Termination Reason' "$RUNNER_TEMP"/smoke-diagnostics/* || true
            echo "::error::CrispAudio crashed during the launch smoke test"; exit 1
          fi
          [ -n "$ALIVE" ] || { echo "::error::CrispAudio was not running 20 s after launch"; exit 1; }
          echo "Sandboxed app launched and stayed up for 20 s"
      - name: Keep launch smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-launch-smoke
          path: ${{ runner.temp }}/smoke-diagnostics
          if-no-files-found: ignore
      - name: Sign and package .pkg
        run: |
          set -euo pipefail
          security unlock-keychain -p "" "$KC"
          # Select identities by SHA-1 from the build keychain. Matching the
          # display name fails on xcode-27: the "ö" in the certificate name and
          # in this file use different Unicode normalizations ("no identity found").
          ids=$(security find-identity -v "$KC")
          APP_CERT=$(printf '%s\n' "$ids" | grep "Apple Distribution: .*($TEAM_ID)" | head -1 | awk '{print $2}')
          INST_CERT=$(printf '%s\n' "$ids" | grep "3rd Party Mac Developer Installer: .*($TEAM_ID)" | head -1 | awk '{print $2}')
          [ -n "$APP_CERT" ] || { echo "::error::Apple Distribution identity missing"; exit 1; }
          [ -n "$INST_CERT" ] || { echo "::error::Mac Installer identity missing"; exit 1; }
          echo "app identity $APP_CERT, installer identity $INST_CERT"

          cp "$PROFILE" "$APP/Contents/embedded.provisionprofile"
          chmod -R a+rX "$APP"
          # Reserve CI numbers above local TestFlight build 14; attempts stay unique.
          BUILD_NO="$((100 + ${{ github.run_number }})).${{ github.run_attempt }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" "$APP/Contents/Info.plist"
          
          while IFS= read -r -d '' f; do
            codesign --force --timestamp --options runtime --keychain "$KC" --sign "$APP_CERT" "$f"
          done < <(find "$APP/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null)
          find "$APP/Contents" -type d -name "*.framework" -print0 2>/dev/null | while IFS= read -r -d '' fw; do
            codesign --force --timestamp --options runtime --keychain "$KC" --sign "$APP_CERT" "$fw"
          done
          
          for helper in crispaudio-apple-media crispaudio-vst3-host; do
            test -f "$APP/Contents/MacOS/$helper"
            codesign --force --timestamp --options runtime \
              --entitlements src-tauri/helper-entitlements.plist \
              --keychain "$KC" --sign "$APP_CERT" "$APP/Contents/MacOS/$helper"
          done

          codesign --force --timestamp --options runtime \
            --entitlements "$RUNNER_TEMP/store-entitlements.plist" \
            --keychain "$KC" --sign "$APP_CERT" "$APP"
            
          python3 scripts/release/check-macos-app.py "$APP" --team "$TEAM_ID" --bundle "$BUNDLE_ID"

          VERSION=$(node -p "require('./package.json').version")
          productbuild --component "$APP" /Applications --keychain "$KC" --sign "$INST_CERT" "CrispAudio_${VERSION}.pkg"
          echo "PKG=CrispAudio_${VERSION}.pkg" >> "$GITHUB_ENV"
          echo "SV=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" >> "$GITHUB_ENV"
          echo "BV=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Contents/Info.plist")" >> "$GITHUB_ENV"
      - name: Verify signed package
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          pkgutil --check-signature "$PKG"
      - name: Keep signed package
        uses: actions/upload-artifact@v4
        with:
          name: mac-appstore-package
          path: ${{ env.PKG }}
      - name: Validate and Upload
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          ASC_APP_ID: 6791876962
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-package "$PKG" --type macos \
            --apple-id "$ASC_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BV" --bundle-short-version-string "$SV" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --output-format json > "$RUNNER_TEMP/mac-upload.json"
          python3 scripts/release/check-altool-result.py "$RUNNER_TEMP/mac-upload.json"
