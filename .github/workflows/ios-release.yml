# iOS App Store release — build a SIGNED IPA and upload to App Store Connect.
#
# Follows the manual-signing recipe from the appstore.md playbook. HARD RULES:
#   * NEVER use -allowProvisioningUpdates (it can mint a cert and revoke the
#     account's shared Distribution cert, breaking every other app). We import
#     the Distribution .p12 and install an explicit, pre-created profile.
#   * A green run does NOT mean the build uploaded. Verify with the ASC API
#     (GET /v1/builds) — a dry run reports success while uploading nothing.
#
# PREREQUISITES (one-time, human — see docs/IOS_SUBMISSION.md):
#   * Bundle id com.crispstrobe.crispaudio registered; app record created.
#   * Provisioning profile "CrispAudio AppStore CI" created for that bundle id,
#     bound to the account's Distribution cert(s).
#   * Repo secrets set: ASC_API_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID,
#     ASC_APP_ID, DIST_CERT_P12_BASE64, DIST_CERT_PASSWORD, ASC_PROFILE_BASE64.
#
# NOTE: the Tauri build/sign step below is the part the playbook flags as
# needing per-account iteration; treat the first run as a shakedown and confirm
# via the ASC API.
name: iOS Release (App Store)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + sign only, skip the App Store upload"
        type: boolean
        default: true

jobs:
  ios-release:
    name: Signed IPA + App Store upload
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TEAM_ID: N9XSJ4M3GT
      BUNDLE_ID: com.crispstrobe.crispaudio
      PROFILE_NAME: CrispAudio AppStore CI
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # App Store now requires the iOS 26 SDK (Xcode 26). The runner may default
      # to an older Xcode, so select the newest available.
      - name: Select newest Xcode
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] || XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Add Rust iOS device target
        run: rustup target add aarch64-apple-ios

      - name: Cache cargo + rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ios-release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ios-release-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Distribution certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Make the temp keychain the default search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.ASC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/pp.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision" | plutil -extract UUID raw -)"
          # Install into BOTH locations — Xcode 16+/26 also reads UserData.
          for PP_DIR in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$PP_DIR"
            cp "$RUNNER_TEMP/pp.mobileprovision" "$PP_DIR/$UUID.mobileprovision"
          done
          echo "Installed profile UUID=$UUID"

      - name: Install App Store Connect API key
        env:
          P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool searches ./private_keys, ~/private_keys, ~/.private_keys and
          # ~/.appstoreconnect/private_keys — write to the guaranteed one.
          mkdir -p "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"
          echo "$P8_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cp "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"

      # NOTE: no pbxproj signing patch — `tauri ios build` re-runs xcodegen and
      # regenerates the project, wiping any pbxproj edit. We archive UNSIGNED
      # (next step) and apply Distribution signing at -exportArchive instead
      # (playbook canonical flow: archive unsigned, sign at export).

      # Stamp a unique build number so each upload is accepted (App Store
      # rejects a duplicate CFBundleVersion). Kept in project.yml so xcodegen
      # (run by `tauri ios build`) re-emits it into the Info.plist.
      - name: Set unique build number
        run: |
          set -euo pipefail
          BUILD_NO="${{ github.run_number }}"
          sed -i '' "s/CFBundleVersion: \"[^\"]*\"/CFBundleVersion: \"${BUILD_NO}\"/" src-tauri/gen/apple/project.yml
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          echo "SHORT_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Archive UNSIGNED (--no-sign → CODE_SIGNING_ALLOWED=NO), so the archive
      # doesn't demand an "iOS Development" cert the CI runner doesn't have.
      # Distribution signing is applied at -exportArchive below. Tauri's own
      # export may fail on an unsigned build — that's expected and harmless; the
      # .xcarchive it produced is what we export. (Also: never --export-method —
      # Tauri's export drops the auth flags and yields a Development-signed IPA.)
      - name: Build iOS archive (unsigned)
        run: |
          PATH="/usr/bin:$PATH" npx tauri ios build --no-sign || \
            echo "::warning::tauri build/export returned non-zero (expected on --no-sign); checking for the archive next"

      - name: Export signed IPA (manual signing)
        id: ipa
        run: |
          set -euo pipefail
          ARCHIVE="$(find src-tauri/gen/apple/build -name '*.xcarchive' | head -1)"
          if [ -z "$ARCHIVE" ]; then echo "No .xcarchive produced" >&2; exit 1; fi
          echo "Archive: $ARCHIVE"
          # Tauri stamps CFBundleVersion from tauri.conf.json (0.3.0); overwrite
          # it with a unique build number BEFORE export. Both the app's own
          # Info.plist AND the archive's ApplicationProperties must be patched —
          # -exportArchive reads the version from the latter.
          APP="$(ls -d "$ARCHIVE/Products/Applications/"*.app | head -1)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $BUILD_NO" "$ARCHIVE/Info.plist" || true
          echo "Patched CFBundleVersion -> $BUILD_NO"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist src-tauri/ExportOptions-appstore.plist
          # PRODUCT_NAME (not "Runner") names the IPA — glob for it.
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then echo "No IPA exported" >&2; exit 1; fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Exported IPA: $IPA"
          # Fail loud if the signature isn't valid before bothering to upload.
          mkdir -p "$RUNNER_TEMP/ipa_check" && (cd "$RUNNER_TEMP/ipa_check" && unzip -oq "$IPA")
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/ipa_check/Payload/"*.app

      # Advisory only — --validate-app can flag non-fatal issues; never let it
      # block the upload (playbook: make validate advisory). NOTE: the runner's
      # altool uses --apiKey/--apiIssuer (camelCase), not the kebab-case forms.
      - name: Validate with App Store Connect (advisory)
        continue-on-error: true
        run: |
          xcrun altool --validate-app -f "${{ steps.ipa.outputs.path }}" --type ios \
            --apple-id "$ASC_APP_ID" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/altool_upload.log"
          # altool exits 0 even when the upload fails validation — fail loud by
          # inspecting its output for the success/failure markers.
          xcrun altool --upload-package "${{ steps.ipa.outputs.path }}" --type ios \
            --apple-id "$ASC_APP_ID" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_NO" \
            --bundle-short-version-string "$SHORT_VERSION" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$OUT"
          if grep -qiE "UPLOAD FAILED|Validation failed" "$OUT"; then
            echo "::error::altool reported errors — nothing was uploaded"; exit 1
          fi
          echo "Uploaded. Verify via the ASC API: GET /v1/builds?filter[app]=$ASC_APP_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrispAudio-ios-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: warn
