[package]
name = "crispaudio-media"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CrispAudio's desktop interview media tools and CLI"

[[bin]]
name = "crispaudio"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rustfft = "6"
hound = "3.5.1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[features]
# Internal native worker graph; not enabled in the CLI or ordinary app.
native-engine = []

[build-dependencies]
crispaudio-native-helper-build = { path = "../scripts/native-helper-build" }

# Content hashing is used by build scripts, including unoptimized app builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.crispaudio-native-helper-build]
opt-level = 3
