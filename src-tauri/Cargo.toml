[package]
name = "crispaudio"
version = "0.9.7"
description = "CrispAudio - Integrated Audio Workstation"
authors = ["CrispStrobe"]
license = "MIT"
repository = "https://github.com/CrispStrobe/crispaudio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crispaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
crispaudio-media = { path = "../media" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
hound = "3.5"
tauri-plugin-crispaudio-native = { path = "plugins/crispaudio-native" }

[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"

[target.'cfg(target_os = "ios")'.dependencies]
# num_threads 0.1.7 calls libc::mach_task_self on iOS. libc 0.2.190
# restricts that wrapper to macOS; retain the compatible release until fixed.
libc = "=0.2.189"

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[profile.dev.package.crispaudio-media]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
