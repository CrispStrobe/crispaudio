[package]
name = "crispaudio"
version = "0.2.1"
description = "CrispAudio - Integrated Audio Workstation"
authors = ["CrispStrobe"]
license = "MIT"
repository = "https://github.com/CrispStrobe/crispaudio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crispaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
hound = "3.5"
