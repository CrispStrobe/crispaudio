<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Cross-platform audio workstation: SFX synthesis, voice effects, timeline editor" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CrispAudio</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash svg { margin-bottom: 16px; }
      #splash .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #1e293b;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg viewBox="0 0 32 32" width="48" height="48" fill="none">
        <circle cx="16" cy="16" r="12" fill="#3b82f6" opacity="0.15"/>
        <path d="M8 16 Q11 10 16 16 Q21 22 24 16" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
      <div style="font-size: 18px; font-weight: 600; color: #e2e8f0;">CrispAudio</div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash once React renders
      const observer = new MutationObserver(() => {
        if (document.getElementById('root')?.children.length) {
          document.getElementById('splash')?.classList.add('hidden');
          setTimeout(() => document.getElementById('splash')?.remove(), 300);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
